name: Cosmore Build and Publish

on:
  push:
    branches:
      - cosmore
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cosmore-build-and-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install PHP dependencies
        run: composer install --no-dev --no-scripts --prefer-dist --no-interaction

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: |
          npx rspack --mode=production
          npx gulp build

      - name: Package plugin as cosmore-lms.zip
        run: |
          mkdir -p dist
          unzip -q tutor-*.zip -d dist/extract
          mv dist/extract/tutor dist/cosmore-lms
          (cd dist && zip -qr cosmore-lms.zip cosmore-lms)

      - name: Publish Composer package (dist branch)
        run: |
          cd dist/cosmore-lms
          cat > composer.json <<'EOF'
          {
            "name": "cosmore/cosmore-lms",
            "description": "Cosmore LMS, built from Cosmore-Group/cosmore-lms",
            "type": "wordpress-plugin",
            "license": "GPL-2.0-or-later",
            "require": {
              "composer/installers": "^2.0"
            }
          }
          EOF
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -Po 'Version:\s*\K[\d.]+' tutor.php | head -1)
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/cosmore-lms.zip \
            --target "$GITHUB_SHA" \
            --title "Cosmore LMS ${VERSION} (${GITHUB_SHA::7})" \
            --notes "Automatic build of ${GITHUB_SHA}"
