name: Cosmore Build and Publish

on:
  push:
    branches:
      - cosmore
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cosmore-build-and-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install PHP dependencies
        run: composer install --no-dev --no-scripts --prefer-dist --no-interaction

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: |
          npx rspack --mode=production
          npx gulp build

      - name: Package plugin as cosmore-lms.zip
        run: |
          mkdir -p dist
          unzip -q tutor-*.zip -d dist/extract
          mv dist/extract/tutor dist/cosmore-lms
          (cd dist && zip -qr cosmore-lms.zip cosmore-lms)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -Po 'Version:\s*\K[\d.]+' tutor.php | head -1)
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/cosmore-lms.zip \
            --target "$GITHUB_SHA" \
            --title "Cosmore LMS ${VERSION} (${GITHUB_SHA::7})" \
            --notes "Automatic build of ${GITHUB_SHA}"
